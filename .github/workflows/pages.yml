name: Publish MarginPilot site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Обновить страницы документов и локальную сборку демо
        run: |
          node prototype/build-document-pages.mjs
          node prototype/build-file-app.mjs
      - name: Подготовить самодостаточный сайт
        run: node prototype/build-pages.mjs
      - name: Загрузить файлы сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-build
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
