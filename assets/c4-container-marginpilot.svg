<svg xmlns="http://www.w3.org/2000/svg" width="2260" height="850" viewBox="0 0 2260 850" role="img" aria-labelledby="title desc">
<title id="title">C4 Container: архитектура MarginPilot</title>
<desc id="desc">Менеджер работает с веб-приложением MarginPilot. Внутри границы MarginPilot находятся один монолит с интерфейсом, внутренним API, расчётами, отправкой изменений и сверкой, а также PostgreSQL. Монолит использует 1С для данных о товарах и затратах и Ozon API для цен, акций, продаж, расходов, отправки изменений и чтения фактического состояния. Кэш названий и ссылок на миниатюры находится в памяти монолита.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#334155"/></marker>
  <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif}
    .title{font-size:26px;font-weight:700;fill:#0f172a}
    .boundary{font-size:22px;font-weight:700;fill:#fff}
    .name{font-size:22px;font-weight:700;fill:#0f172a}
    .kind{font-size:14px;font-weight:700;fill:#475569;letter-spacing:.4px}
    .detail{font-size:16px;fill:#334155}
    .relation{font-size:15px;font-weight:600;fill:#334155}
    .relationBlue{font-size:15px;font-weight:600;fill:#1d4ed8}
    .line{fill:none;stroke:#334155;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .api{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blueArrow)}
    .exchange{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#blueArrow);marker-end:url(#blueArrow)}
  </style>
</defs>
<rect width="2260" height="850" fill="url(#bg)"/>
<text class="title" x="40" y="44">MarginPilot · контейнерная диаграмма C4</text>

<!-- Граница внутренней системы и два подтверждённых контейнера. -->
<rect x="472" y="94" width="1200" height="654" rx="20" fill="#0f172a" opacity=".06"/>
<rect x="470" y="90" width="1200" height="654" rx="20" fill="#f4f8ff" stroke="#94a3b8" stroke-width="2"/>
<path d="M490 90 H1650 Q1670 90 1670 110 V150 H470 V110 Q470 90 490 90 Z" fill="#1e3a5f"/>
<text class="boundary" x="510" y="130">MarginPilot · внутренняя система</text>

<!-- Связи под карточками, чтобы линии не перекрывали подписи. -->
<path class="line" d="M380 405 H570"/>
<path class="line" d="M980 420 H1180"/>
<path class="api" d="M775 265 V220 H1810"/>
<path class="exchange" d="M775 565 V660 H1810"/>

<!-- Человек. -->
<rect x="82" y="314" width="300" height="192" rx="16" fill="#0f172a" opacity=".06"/>
<rect x="80" y="310" width="300" height="192" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="124" cy="362" r="12" fill="none" stroke="#b45309" stroke-width="2.5"/>
<path d="M102 406 Q102 383 124 383 Q146 383 146 406" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
<text class="kind" x="170" y="355">ЧЕЛОВЕК</text>
<text class="name" x="170" y="388">Менеджер</text>
<text class="detail" x="105" y="447">Оценивает SKU, принимает</text>
<text class="detail" x="105" y="470">решение и проверяет результат</text>

<!-- Контейнер 1: приложение без выдуманного разделения на сервисы. -->
<rect x="572" y="269" width="410" height="300" rx="16" fill="#0f172a" opacity=".07"/>
<rect x="570" y="265" width="410" height="300" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="592" y="285" width="116" height="28" rx="14" fill="#dbeafe"/>
<text class="kind" x="606" y="304" fill="#1d4ed8">КОНТЕЙНЕР</text>
<text class="name" x="592" y="349">MarginPilot</text>
<text class="detail" x="592" y="376">Веб-приложение · монолит</text>
<path d="M592 394 H958" stroke="#bfdbfe" stroke-width="1.5"/>
<text class="detail" x="592" y="425">Интерфейс и внутренний HTTP API</text>
<text class="detail" x="592" y="453">Оценка экономики и порогов</text>
<text class="detail" x="592" y="481">Пакеты, отправка и сверка Ozon</text>
<text class="detail" x="592" y="509">План-факт по SKU</text>
<text class="detail" x="592" y="541">Кэш в памяти: имя и миниатюра</text>

<!-- Контейнер 2: постоянное хранилище. -->
<rect x="1182" y="304" width="410" height="238" rx="16" fill="#0f172a" opacity=".07"/>
<rect x="1180" y="300" width="410" height="238" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/>
<rect x="1202" y="320" width="116" height="28" rx="14" fill="#e2e8f0"/>
<text class="kind" x="1216" y="339">КОНТЕЙНЕР</text>
<text class="name" x="1202" y="383">PostgreSQL</text>
<text class="detail" x="1202" y="410">Постоянное хранение:</text>
<text class="detail" x="1202" y="443">SKU, параметры и пакеты</text>
<text class="detail" x="1202" y="471">Решения и версии плана</text>
<text class="detail" x="1202" y="499">Продажи и фактические расходы</text>

<!-- Внешние системы — вне границы MarginPilot. -->
<rect x="1812" y="159" width="330" height="162" rx="16" fill="#0f172a" opacity=".06"/>
<rect x="1810" y="155" width="330" height="162" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/>
<rect x="1832" y="175" width="170" height="28" rx="14" fill="#e2e8f0"/>
<text class="kind" x="1846" y="194">ВНЕШНЯЯ СИСТЕМА</text>
<text class="name" x="1832" y="239">1С</text>
<text class="detail" x="1832" y="272">Товары и затраты</text>
<text class="detail" x="1832" y="296">для расчёта экономики</text>

<rect x="1812" y="499" width="330" height="190" rx="16" fill="#0f172a" opacity=".06"/>
<rect x="1810" y="495" width="330" height="190" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/>
<rect x="1832" y="515" width="170" height="28" rx="14" fill="#e2e8f0"/>
<text class="kind" x="1846" y="534">ВНЕШНЯЯ СИСТЕМА</text>
<text class="name" x="1832" y="579">Ozon API</text>
<text class="detail" x="1832" y="610">Цены, акции, продажи,</text>
<text class="detail" x="1832" y="634">расходы и фактический</text>
<text class="detail" x="1832" y="658">статус товаров</text>

<!-- Подписи отношений. -->
<text class="relation" x="408" y="388">Работа с SKU</text>
<text class="relation" x="994" y="399">Читает / записывает</text>
<text class="relationBlue" x="1120" y="201">Получает товары и затраты через API</text>
<text class="relationBlue" x="1110" y="614">Передаёт цены и решения по акциям</text>
<text class="relationBlue" x="1110" y="639">Получает условия, продажи, расходы и статусы</text>

<rect x="40" y="777" width="1310" height="48" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="62" y="789" width="34" height="24" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text class="detail" x="106" y="807">Человек</text>
<rect x="244" y="789" width="34" height="24" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text class="detail" x="288" y="807">Контейнер MarginPilot</text>
<rect x="575" y="789" width="34" height="24" rx="7" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
<text class="detail" x="619" y="807">Внешняя система</text>
<path d="M865 801 H899" stroke="#334155" stroke-width="2"/>
<path d="M895 797 L902 801 L895 805 Z" fill="#334155"/>
<text class="detail" x="911" y="807">Связь</text>
<path d="M1005 801 H1039" stroke="#2563eb" stroke-width="2"/>
<path d="M1035 797 L1042 801 L1035 805 Z" fill="#2563eb"/>
<text class="detail" x="1051" y="807">Интеграция через API</text>
</svg>
