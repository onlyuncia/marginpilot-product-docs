<title id="title">BPMN: подготовка и применение цен до MarginPilot</title>
<desc id="desc">Ручной процесс менеджера: пересчёт в рабочей книге, подготовка шаблона, загрузка в Ozon, получение выгрузки актуальных цен и последующая сверка.</desc>
