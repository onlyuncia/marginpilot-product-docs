<text class="small" x="344" y="840">Автоматически в MarginPilot</text>
<polygon points="614,822 627,835 614,848 601,835" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text class="small" x="638" y="840">Исключающий шлюз</text>
<path d="M830 835 H864" stroke="#334155" stroke-width="2"/>
