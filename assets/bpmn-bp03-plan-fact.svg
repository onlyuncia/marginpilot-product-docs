<rect x="40" y="811" width="1170" height="48" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="62" y="823" width="34" height="24" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text class="small" x="106" y="840">Действие менеджера</text>
