<path d="M600 679 Q705 705 810 679" fill="none" stroke="#64748b" stroke-width="2"/>
<text class="store" x="705" y="653" text-anchor="middle">PostgreSQL</text>
<text class="small" x="705" y="673" text-anchor="middle">продажи · расходы</text>
<text class="small" x="705" y="691" text-anchor="middle">версии плана</text>
<text class="small" x="718" y="541">чтение</text>

<rect x="928" y="390" width="38" height="22" rx="11" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="pill" x="947" y="405" text-anchor="middle">Да</text>
