<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1010" viewBox="0 0 2140 1010" role="img" aria-labelledby="title desc"><title id="title">BPMN: управление участием SKU в акции Ozon</title>
<desc id="desc">Менеджер выбирает добавление или удаление SKU из акции. При добавлении MarginPilot сравнивает цену входа с экономическим порогом, при необходимости показывает предупреждение. Система передаёт решение в Ozon, разбирает ответ и отдельно сверяет фактический статус участия по SKU.</desc>
