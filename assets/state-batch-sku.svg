<svg xmlns="http://www.w3.org/2000/svg" width="2260" height="1140" viewBox="0 0 2260 1140" role="img" aria-labelledby="title desc">
<title id="title">Состояния пакета и результатов по SKU в MarginPilot</title>
<desc id="desc">Состояние пакета меняется от accepted к verifying, затем по результатам сверки к confirmed, partial или unconfirmed. Из unconfirmed запускается повторное чтение фактического состояния без повторной отправки команды. Для каждого SKU отдельно хранятся submission_result — ответ Ozon на отправку, и verification_result — результат отдельной проверки фактического состояния.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#334155"/></marker>
  <style>
    text{font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif}
    .title{font-size:26px;font-weight:700;fill:#0f172a}
    .section{font-size:21px;font-weight:700;fill:#1e3a5f}
    .state{font-size:19px;font-weight:700;fill:#0f172a}
    .detail{font-size:15px;fill:#475569}
    .label{font-size:14px;font-weight:600;fill:#334155}
    .key{font-size:15px;font-weight:700;fill:#1d4ed8}
    .line{fill:none;stroke:#334155;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="2260" height="1140" fill="url(#bg)"/>
<text class="title" x="40" y="44">MarginPilot · состояния пакета и SKU</text>

<!-- Пакет: состояние агрегируется по фактической сверке SKU. -->
<rect x="42" y="74" width="2180" height="516" rx="16" fill="#0f172a" opacity=".06"/>
<rect x="40" y="70" width="2180" height="516" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="70" width="2180" height="65" rx="16" fill="#1e3a5f"/>
<rect x="40" y="118" width="2180" height="17" fill="#1e3a5f"/>
<text x="70" y="112" font-size="21" font-weight="700" fill="#fff">Пакет · change_batch.status</text>

<circle cx="95" cy="290" r="13" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
<path class="line" d="M108 290 H130"/>
<path class="line" d="M380 290 H490"/>
<path class="line" d="M750 290 H1032"/>
<path class="line" d="M1060 262 V190 H1560"/>
<path class="line" d="M1088 290 H1390 V310 H1560"/>
<path class="line" d="M1060 318 H1260 V430 H1560"/>
<path class="line" d="M1710 475 V545 H1060 V318"/>

<rect x="132" y="249" width="250" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="130" y="245" width="250" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text class="state" x="255" y="284" text-anchor="middle">accepted</text>
<text class="detail" x="255" y="311" text-anchor="middle">Команда принята: 202</text>

<rect x="492" y="249" width="260" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="490" y="245" width="260" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text class="state" x="620" y="284" text-anchor="middle">verifying</text>
<text class="detail" x="620" y="311" text-anchor="middle">Отправка и сверка в работе</text>

<polygon points="1060,262 1088,290 1060,318 1032,290" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M1051 281 L1069 299 M1069 281 L1051 299" stroke="#a16207" stroke-width="3" stroke-linecap="round"/>
<text class="detail" x="1020" y="350" text-anchor="end">Итог по SKU?</text>

<rect x="1562" y="149" width="300" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="1560" y="145" width="300" height="90" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.4"/>
<text class="state" x="1710" y="183" text-anchor="middle">confirmed</text>
<text class="detail" x="1710" y="210" text-anchor="middle">Все SKU достигли цели</text>

<rect x="1562" y="269" width="300" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="1560" y="265" width="300" height="90" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4"/>
<text class="state" x="1710" y="303" text-anchor="middle">partial</text>
<text class="detail" x="1710" y="330" text-anchor="middle">Все проверены; есть расхождения</text>

<rect x="1562" y="389" width="300" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="1560" y="385" width="300" height="90" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
<text class="state" x="1710" y="423" text-anchor="middle">unconfirmed</text>
<text class="detail" x="1710" y="450" text-anchor="middle">Есть непроверенные SKU</text>

<text class="label" x="396" y="271">Начата обработка</text>
<text class="label" x="1135" y="173">Все SKU совпали</text>
<text class="label" x="1130" y="272">Проверка завершена, есть расхождения</text>
<text class="label" x="1300" y="410">Есть непроверенные SKU</text>
<text class="label" x="1270" y="529">Повтор чтения без повторной отправки</text>

<!-- По одному SKU сохраняются не один, а два независимых результата. -->
<rect x="42" y="624" width="1020" height="476" rx="16" fill="#0f172a" opacity=".06"/>
<rect x="40" y="620" width="1020" height="476" rx="16" fill="#fffdf8" stroke="#d6c5a9" stroke-width="2"/>
<text class="section" x="70" y="668">Ответ Ozon на отправку</text>
<text class="key" x="70" y="695">submission_result</text>

<path class="line" d="M330 791 H470 V750 H625"/>
<path class="line" d="M330 825 H505 V865 H625"/>
<path class="line" d="M330 850 H470 V980 H625"/>

<rect x="92" y="784" width="240" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="90" y="780" width="240" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text class="state" x="210" y="818" text-anchor="middle">pending</text>
<text class="detail" x="210" y="845" text-anchor="middle">Ответ ещё ожидается</text>

<rect x="627" y="709" width="300" height="80" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="625" y="705" width="300" height="80" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text class="state" x="775" y="740" text-anchor="middle">reported_success</text>
<text class="detail" x="775" y="764" text-anchor="middle">Ozon сообщил об успехе</text>

<rect x="627" y="824" width="300" height="80" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="625" y="820" width="300" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text class="state" x="775" y="855" text-anchor="middle">rejected</text>
<text class="detail" x="775" y="879" text-anchor="middle">Ozon отклонил действие</text>

<rect x="627" y="939" width="300" height="80" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="625" y="935" width="300" height="80" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text class="state" x="775" y="970" text-anchor="middle">unknown</text>
<text class="detail" x="775" y="994" text-anchor="middle">Ответ не получен вовремя</text>

<text class="label" x="370" y="729">Ответ об успехе</text>
<text class="label" x="370" y="844">Отказ по SKU</text>
<text class="label" x="370" y="964">Таймаут</text>

<rect x="1102" y="624" width="1118" height="476" rx="16" fill="#0f172a" opacity=".06"/>
<rect x="1100" y="620" width="1118" height="476" rx="16" fill="#f4f8ff" stroke="#b7cbe4" stroke-width="2"/>
<text class="section" x="1130" y="668">Фактическое состояние в Ozon</text>
<text class="key" x="1130" y="695">verification_result</text>
<text class="detail" x="1130" y="724">Проверяется отдельным чтением, независимо от ответа на отправку</text>

<path class="line" d="M1400 792 H1570 V775 H1740"/>
<path class="line" d="M1400 846 H1570 V945 H1740"/>
<path class="line" d="M1275 875 V1040 H1135 V830 H1160"/>

<rect x="1162" y="789" width="240" height="90" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="1160" y="785" width="240" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text class="state" x="1280" y="823" text-anchor="middle">pending</text>
<text class="detail" x="1280" y="850" text-anchor="middle">Сверка ещё не завершена</text>

<rect x="1742" y="739" width="310" height="80" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="1740" y="735" width="310" height="80" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text class="state" x="1895" y="770" text-anchor="middle">matched</text>
<text class="detail" x="1895" y="794" text-anchor="middle">Целевое состояние подтверждено</text>

<rect x="1742" y="909" width="310" height="80" rx="14" fill="#0f172a" opacity=".06"/>
<rect x="1740" y="905" width="310" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text class="state" x="1895" y="940" text-anchor="middle">mismatch</text>
<text class="detail" x="1895" y="964" text-anchor="middle">Фактическое состояние отличается</text>

<text class="label" x="1540" y="750">Цель достигнута</text>
<text class="label" x="1540" y="920">Есть расхождение</text>
<text class="label" x="1145" y="1024">Чтение недоступно — повтор позже</text>

<text class="detail" x="40" y="1128">Например, после таймаута отправки возможны submission_result = unknown и verification_result = matched.</text>
</svg>
